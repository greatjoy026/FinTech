name: CORE-001 Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'remediation/**', 'core-002-*', 'core-003-*']

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (frozen lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore generated Prisma client
        run: npx prisma generate
      - name: Static security gate
        run: npm run security:verify
      - name: SEC-013 behavioral security regression gate
        run: npm run security:regression:verify
      - name: SEC-014 observability security regression gate
        run: npm run observability:security:verify
      - name: SEC-015 reliability regression gate
        run: npm run reliability:security:verify
      - name: SEC-016 deployment infrastructure security gate
        run: npm run deployment:security:verify
      - name: SEC-017 release governance regression gate
        run: npm run release:security:verify
      - name: SEC-018 data protection and recovery regression gate
        run: npm run data-recovery:security:verify
      - name: SEC-019 access-control and privileged operations regression gate
        run: npm run access-control:security:verify
      - name: SEC-020 security governance regression gate
        run: npm run governance:security:verify
      - name: SEC-021 architecture closure regression gate
        run: npm run architecture-closure:security:verify
      - name: CORE-002 accounting regression gate
        run: npm run accounting:security:verify
      - name: CORE-002 executable accounting invariant tests
        run: npm run accounting:invariants:test
      - name: CORE-003 wallet integrity regression gate
        run: npm run wallet:security:verify
      - name: CORE-003 executable wallet invariant tests
        run: npm run wallet:invariants:test
      - name: Authentication security regression gate
        run: npm run auth:security:verify
      - name: Authorization security regression gate
        run: npm run authorization:security:verify
      - name: API security regression gate
        run: npm run api:security:verify
      - name: Abuse protection security regression gate
        run: npm run abuse:security:verify
      - name: Audit security regression gate
        run: npm run audit:security:verify
      - name: Configuration and secret hygiene gate
        run: npm run config:security:verify
      - name: Dependency supply-chain gate
        run: npm run dependency:security:verify
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: TypeScript gate
        run: npm run lint
      - name: Production build gate
        run: npm run build
      - name: Built artifact secret leakage gate
        run: npm run bundle:security:verify
