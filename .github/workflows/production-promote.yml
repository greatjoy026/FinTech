name: Promote Immutable Release to Production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Immutable GHCR image reference, including @sha256 digest'
        required: true
        type: string
      release:
        description: 'Release tag associated with the image (for auditability)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote:
    name: Validate production promotion
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate immutable image reference
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE: ${{ inputs.release }}
        run: |
          case "$IMAGE_DIGEST" in
            *'@sha256:'*) ;;
            *) echo 'Production promotion requires an immutable @sha256 image reference.'; exit 1 ;;
          esac
          case "$IMAGE_DIGEST" in
            *'@sha256:'????????????????????????????????????????????????????????????????) ;;
            *) echo 'Invalid image digest format.'; exit 1 ;;
          esac
          case "$RELEASE" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Release must use semantic version tag form vMAJOR.MINOR.PATCH.'; exit 1 ;;
          esac
      - name: Production migration command gate
        run: |
          test -f package.json
          node -e "const p=require('./package.json'); if(p.scripts?.['db:migrate:deploy']!=='prisma migrate deploy') process.exit(1)"
      - name: Record promotion intent
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE: ${{ inputs.release }}
        run: |
          printf 'release=%s\nimage=%s\ncommit=%s\n' "$RELEASE" "$IMAGE_DIGEST" "$GITHUB_SHA"
          echo 'No direct infrastructure deployment is performed by this repository workflow.'
          echo 'The approved immutable image and migration gate are the release boundary.'
