name: SEC-012 Audit Remediation

on:
  push:
    branches: [remediation/core-001-sec012-supply-chain]

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking npm audit remediations
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency remediation changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(sec-012): remediate audited dependency vulnerabilities'
          git push origin HEAD:remediation/core-001-sec012-supply-chain
